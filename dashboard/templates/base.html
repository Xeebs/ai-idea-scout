<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Idea Scout">
  <meta name="theme-color" content="#0a84ff">
  <title>{% block title %}AI Idea Scout{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>🔭 AI Idea Scout</h1>
    <nav class="tabs">
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Dashboard</a>
      <a href="{{ url_for('ideas_list', track='infra') }}" class="{{ 'active' if request.endpoint == 'ideas_list' and request.view_args.get('track') == 'infra' or request.endpoint == 'idea_detail' and request.view_args.get('track') == 'infra' }}">Infra Ideas</a>
      <a href="{{ url_for('ideas_list', track='marketplace') }}" class="{{ 'active' if request.endpoint == 'ideas_list' and request.view_args.get('track') == 'marketplace' or request.endpoint == 'idea_detail' and request.view_args.get('track') == 'marketplace' }}">Market Ideas</a>
      <a href="{{ url_for('review_queue') }}" class="{{ 'active' if request.endpoint == 'review_queue' }}">Review Queue</a>
      <a href="{{ url_for('feedback_home') }}" class="{{ 'active' if request.endpoint == 'feedback_home' }}">Feedback</a>
      <a href="{{ url_for('skills_list') }}" class="{{ 'active' if request.endpoint == 'skills_list' }}">Skills</a>
      <a href="{{ url_for('published_list') }}" class="{{ 'active' if request.endpoint == 'published_list' }}">Published</a>
    </nav>
  </header>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
