{% extends "base.html" %}
{% block title %}Published{% endblock %}
{% block content %}

<h2 style="margin:4px 0 10px;">Published (public writeups)</h2>

<div class="card">
  {% if not items %}
    <div class="empty">Nothing published yet.</div>
  {% endif %}
  {% for item in items %}
    <div class="idea-item">
      <div class="title">{{ item.title }}</div>
      <div class="meta">{{ item.slug }}</div>
    </div>
  {% endfor %}
</div>

{% endblock %}
